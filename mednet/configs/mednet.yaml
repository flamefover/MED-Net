# MED-Net model architecture configuration.
# AGPL-3.0; see LICENSE.
nc: 4  # Four-class reference; set nc=10 for RUOD.
stage_depths: [3, 6, 9, 3]
# Deterministic forward-execution priority order for FRJ.
frj_priority: [10, 13, 16, 19, 22, 25]
scale: n  # Default model scale.
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]
# MSCRepViT contains the configured stages and MFG at all four output scales.
# Graph cache indices: 1..4 backbone scales; 5 MFG output.
backbone: MSCRepViT
# [from, repeats before depth scaling, module, arguments]
layers:
  - [-1, 1, SPPF, [1024, 5]]                    # 6
  - [-1, 2, C2PSA, [1024]]                     # 7
  - [-1, 1, Upsample, [2, nearest]]             # 8
  - [[-1, 3], 1, Concat, [1]]                  # 9
  - [-1, 2, AMDFFusion, [512]]                  # 10, code determined by FRJ
  - [-1, 1, Upsample, [2, nearest]]             # 11
  - [[-1, 2], 1, Concat, [1]]                  # 12
  - [-1, 2, AMDFFusion, [256]]                  # 13
  - [-1, 1, Upsample, [2, nearest]]             # 14
  - [[-1, 1], 1, Concat, [1]]                  # 15
  - [-1, 2, AMDFFusion, [128]]                  # 16
  - [-1, 1, AMDFDownsample, []]                # 17
  - [[-1, 13], 1, Concat, [1]]                 # 18
  - [-1, 2, AMDFFusion, [256]]                 # 19
  - [-1, 1, AMDFDownsample, []]                # 20
  - [[-1, 10], 1, Concat, [1]]                 # 21
  - [-1, 2, AMDFFusion, [512]]                 # 22
  - [-1, 1, AMDFDownsample, []]                # 23
  - [[-1, 7], 1, Concat, [1]]                  # 24
  - [-1, 2, AMDFFusion, [1024]]                # 25
  - [[19, 22, 25], 1, UDEH, [256]]            # 26, strides 8/16/32
